<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data: https://cdn.233.momobako.com"><title>MD助手</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="title-group"><h1>MD助手</h1><div class="deck-status-wrap"><button id="deck-status" class="status-pill warn" aria-label="尚未获取卡组" aria-describedby="deck-status-tip">!</button><span id="deck-status-tip" role="tooltip">尚未获取卡组</span></div></div><div class="window-actions"><button id="minimize" aria-label="最小化到托盘" title="最小化到托盘">−</button><button id="close" aria-label="关闭窗口，保留后台运行" title="关闭窗口，保留后台运行；从托盘退出">×</button></div></header>
<main id="content" aria-live="polite"></main><dialog id="card-detail" aria-labelledby="card-detail-title"></dialog><div id="toast" role="alert" hidden></div>
<footer><span id="connection">等待连接</span><button id="settings" aria-label="设置">⚙</button></footer>
<script type="module" src="app.js"></script></body></html>
